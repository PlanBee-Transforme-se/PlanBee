<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PlanBee: organize eventos, tarefas e orçamento em um só lugar."
    />
    <title>PlanBee | Meus Eventos</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <link rel="stylesheet" href="../css/modals.css" />
    <link rel="stylesheet" href="../css/eventos.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/modals.js" defer></script>
    <script src="../js/eventos.js" defer></script>
  </head>
  <body class="app-layout">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>

      <div class="app-main">
        <header class="topbar" id="header"></header>

        <main class="main-content" id="conteudo-principal">
          <h1>Meus Eventos</h1>

          <section aria-labelledby="eventos-descricao">
            <h2 id="eventos-descricao">Seus eventos</h2>
            <p>Cadastre e acompanhe eventos estudantis e comunitários.</p>
            <button type="button" disabled>
              + Novo evento (em desenvolvimento)
            </button>
          </section>

          <section aria-labelledby="lista-eventos">
            <h2 id="lista-eventos">Lista de eventos</h2>

            <div id="lista-de-eventos">
              <p>Os eventos cadastrados aparecerão aqui.</p>
            </div>
          </section>
        </main>
      </div>
    </div>

    <footer class="footer" id="footer"></footer>
  </body>
</html>
