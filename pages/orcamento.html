<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PlanBee: organize eventos, tarefas e orçamento em um só lugar.">
  <title>PlanBee | Orçamento</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/main.js" defer></script>
</head>
<body>
  <!-- Estrutura inicial: as funcionalidades serão desenvolvidas com JavaScript. -->
  <aside class="sidebar" aria-label="Menu principal">
    <a class="logo" href="../index.html">🐝 PlanBee</a>
    <nav aria-label="Navegação">
      <ul>
        <li><a href="../index.html">Início</a></li>

    <header class="topbar">
      <span>PlanBee • Planejamento de eventos</span>

        </div>
