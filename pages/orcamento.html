<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PlanBee: organize eventos, tarefas e orçamento em um só lugar.">
  <title>PlanBee | Orçamento</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/orcamento.css">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/modals.js" defer></script>
  <script src="../js/orcamento.js" defer></script>
</head>

<body class="app-layout">

  <!-- Menu lateral -->
  <div class="app-shell">

    <aside class="sidebar" id="sidebar"></aside>

    <div class="app-main">

      <!-- Cabeçalho -->
      <header class="topbar" id="header"></header>

      <main class="main-content" id="conteudo-principal">
        <h1>Orçamento</h1>
        <section aria-labelledby="resumo-financeiro">
          <h2 id="resumo-financeiro">Resumo financeiro</h2>
          <p>Orçamento total, despesas e saldo disponível aparecerão aqui.</p>
        </section>

        <section aria-labelledby="despesas" >
          <h2 id="despesas">Despesas do evento</h2>
          <button type="button" disabled>+ Nova despesa (em desenvolvimento)</button>
          <div id="lista-de-despesas">
            <p>As despesas cadastradas aparecerão aqui.</p>
          </div>
        </section>
      </main>

    </div>

  </div>

  <!-- Rodapé -->
  <footer class="footer" id="footer"></footer>
  </div>
</body>

</html>
