<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PlanBee: organize eventos, tarefas e orçamento em um só lugar.">
  <title>PlanBee | Planejamento</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/planejamento.css">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/modals.js" defer></script>
  <script src="../js/planejamento.js" defer></script>
</head>

  <body class="app-layout">

    <!-- Menu lateral -->
    <div class="app-shell">

      <aside class="sidebar" id="sidebar"></aside>

      <div class="app-main">

        <!-- Cabeçalho -->
        <header class="topbar" id="header"></header>

        <main class="main-content" id="conteudo-principal">
          <h1>Planejamento</h1>
          <section aria-labelledby="evento-selecionado">
            <h2 id="evento-selecionado">Evento selecionado</h2>
            <p>Selecione um evento para visualizar o planejamento.</p>
          </section>

          <section aria-labelledby="quadro-tarefas">
            <h2 id="quadro-tarefas">Tarefas e responsáveis</h2>
            <button type="button" disabled>+ Nova tarefa (em desenvolvimento)</button>
            <div id="lista-de-tarefas">
              <p>As tarefas, os responsáveis e os status aparecerão aqui.</p>
            </div>
          </section>
        </main>

      </div>

    </div>

    <!-- Rodapé -->
    <footer class="footer" id="footer"></footer>
  </body>
</html>
